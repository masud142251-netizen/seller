<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY - SELLER CENTER & CATEGORY ECOSYSTEM</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #111111;
            --header-retail: rgba(12, 12, 12, 0.95);
            --footer-retail: rgba(12, 12, 12, 0.95);
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --pink-discount: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; 
        }
        body { padding-top: 85px; padding-bottom: 90px; display: flex; flex-direction: column; align-items: center; }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* হেডার লেআউট */
        header.app-header {
            display: flex; flex-direction: column; padding: 6px 10px; align-items: center;
            background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15);
            gap: 5px;
        }

        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 24px; height: 24px; object-fit: contain; background: transparent; }
        .brand-title-main { font-size: 0.85rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }

        .header-bottom-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; gap: 6px; }
        .portal-btn {
            font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3);
            color: var(--text-white); padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; white-space: nowrap; text-align: center; flex: 1; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .portal-btn:hover { border-color: var(--gold-solid); background: var(--gold-gradient); color: #000; font-weight: 800; }

        /* মেইন কন্টেইনার / সেলার প্যানেল */
        .seller-dashboard-card {
            background: #111; border: 1.5px solid rgba(212,175,55,0.3);
            border-radius: 14px; width: 92%; max-width: 550px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); margin-top: 15px;
        }

        .section-title {
            font-size: 0.95rem; font-weight: 900; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; margin-bottom: 15px; text-align: center;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.65rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; font-weight: 800; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: #000; border: 1.5px solid rgba(212,175,55,0.3);
            padding: 10px 12px; color: #fff; border-radius: 8px; font-size: 0.82rem; outline: none;
        }

        .btn-gold-glow {
            background: var(--gold-gradient); border: none; padding: 12px; border-radius: 25px;
            color: #000; font-weight: 900; font-size: 0.78rem; cursor: pointer; text-transform: uppercase;
            width: 100%; text-align: center; margin-top: 10px; box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }

        /* ক্যাটাগরি ফুলস্ক্রিন ওভারলে */
        .category-fullscreen-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-retail); z-index: 4000; overflow-y: auto; padding: 20px 12px 90px 12px;
        }
        .golden-close-btn {
            background: #141414; border: 1px solid rgba(212,175,55,0.4); width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: fixed; top: 15px; right: 15px; z-index: 99999;
        }
        .golden-close-btn i { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .category-section { padding: 14px 8px; }
        .category-header-row { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 0.9rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        @media (min-width: 576px) { .app-store-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .app-store-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }

        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 14px 10px; display: flex; align-items: center; text-align: left; cursor: pointer; transition: all 0.3s; gap: 12px; min-height: 70px; }
        .app-card:hover { transform: translateY(-2px); background: #1a1a1e; border-color: rgba(212, 175, 55, 0.3); }
        .app-card-icon i { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.7rem; font-weight: 600; color: var(--text-white); text-transform: uppercase; }

        /* ফিক্সড বটম ন্যাভবার */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 5000; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; transition: 0.3s;
        }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item:hover { color: var(--gold-solid); transform: translateY(-2px); }
        .nav-item span { text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header class="app-header">
        <div class="header-top-bar">
            <div class="header-center-group" onclick="location.href='https://rorraxy.com'">
                <img src="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG" alt="Logo" class="brand-logo-img">
                <span class="brand-title-main">RORRAXY SELLER CENTER</span>
            </div>
        </div>
        <div class="header-bottom-row">
            <button class="portal-btn" onclick="openCategoryView()">Browse Home Categories</button>
            <button class="portal-btn" onclick="alert('Connected to Main Ecosystem!')">Sync Status: Active</button>
        </div>
    </header>

    <!-- সেলার প্রোডাক্ট আপলোড ফর্ম (যেখানে হোম পেজের ক্যাটাগরিগুলো ডাইনামিকলি কানেক্টেড) -->
    <div class="seller-dashboard-card">
        <h3 class="section-title">Upload New Product (Synced)</h3>
        <form onsubmit="handleProductUpload(event)">
            <div class="form-group">
                <label>Product Title *</label>
                <input type="text" id="prodTitle" placeholder="Enter product name..." required>
            </div>

            <!-- হোম পেজের ক্যাটাগরি কাঠামোর সাথে সংযুক্ত ড্রপডাউন -->
            <div class="form-group">
                <label>Select Main Category & Subcategory *</label>
                <select id="prodCategorySelect" required>
                    <optgroup label="1. Women's Fashion">
                        <option value="Women's Fashion > Clothing">Clothing</option>
                        <option value="Women's Fashion > Handbags">Handbags</option>
                        <option value="Women's Fashion > Shoes">Shoes</option>
                        <option value="Women's Fashion > Jewelry">Jewelry</option>
                        <option value="Women's Fashion > Watches">Watches</option>
                        <option value="Women's Fashion > Beauty">Beauty</option>
                    </optgroup>
                    <optgroup label="2. Boys' Fashion">
                        <option value="Boys' Fashion > Clothing">Clothing</option>
                        <option value="Boys' Fashion > Shoes">Shoes</option>
                        <option value="Boys' Fashion > Watches">Watches</option>
                        <option value="Boys' Fashion > Accessories">Accessories</option>
                    </optgroup>
                    <optgroup label="3. Matching Sets">
                        <option value="Matching Sets > Couple Sets">Couple Sets</option>
                        <option value="Matching Sets > Family Sets">Family Sets</option>
                        <option value="Matching Sets > Mom & Me">Mom & Me</option>
                        <option value="Matching Sets > Value Bundles">Value Bundles</option>
                    </optgroup>
                    <optgroup label="4. Luxury Gifts">
                        <option value="Luxury Gifts > Corporate Gifts">Corporate Gifts</option>
                        <option value="Luxury Gifts > Luxury Items">Luxury Items</option>
                        <option value="Luxury Gifts > Wood Resin">Wood Resin</option>
                    </optgroup>
                    <optgroup label="5. Girls' Fashion">
                        <option value="Girls' Fashion > Clothing">Clothing</option>
                        <option value="Girls' Fashion > Party Dresses">Party Dresses</option>
                        <option value="Girls' Fashion > Jewelry">Jewelry</option>
                    </optgroup>
                    <optgroup label="6. Men's Fashion">
                        <option value="Men's Fashion > Clothing">Clothing</option>
                        <option value="Men's Fashion > Shoes">Shoes</option>
                        <option value="Men's Fashion > Grooming">Grooming</option>
                    </optgroup>
                    <optgroup label="7. Mother & Baby">
                        <option value="Mother & Baby > Baby Clothing">Baby Clothing</option>
                        <option value="Mother & Baby > Maternity">Maternity</option>
                        <option value="Mother & Baby > Baby Care">Baby Care</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Price ($ USD) *</label>
                <input type="number" id="prodPrice" placeholder="0.00" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Product Image URL *</label>
                <input type="url" id="prodImg" placeholder="https://..." required>
            </div>

            <button type="submit" class="btn-gold-glow">Publish Product to Ecosystem</button>
        </form>
    </div>

    <!-- ক্যাটাগরি ওভারলে (হোম পেজের হুবহু মেনুবার স্ট্রাকচার) -->
    <div id="categoryView" class="category-fullscreen-view">
        <div class="golden-close-btn" onclick="toggleCategoryView()"><i class="fa-solid fa-xmark"></i></div>
        <div style="margin-bottom: 25px; text-align: center;">
            <span style="font-size:1.1rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; letter-spacing: 1px;">Home Categories Structure</span>
        </div>

        <div id="dynamicCategoryContent">
            <section class="category-section">
                <div class="category-header-row"><h2 class="category-title">1. Women's Fashion</h2></div>
                <div class="app-store-grid">
                    <div class="app-card" onclick="selectCategoryFromModal('Women\'s Fashion > Clothing')"><div class="app-card-icon"><i class="fa-solid fa-shirt"></i></div><span class="app-card-name">Clothing</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Women\'s Fashion > Handbags')"><div class="app-card-icon"><i class="fa-solid fa-bag-shopping"></i></div><span class="app-card-name">Handbags</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Women\'s Fashion > Shoes')"><div class="app-card-icon"><i class="fa-solid fa-shoe-prints"></i></div><span class="app-card-name">Shoes</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Women\'s Fashion > Jewelry')"><div class="app-card-icon"><i class="fa-solid fa-gem"></i></div><span class="app-card-name">Jewelry</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Women\'s Fashion > Watches')"><div class="app-card-icon"><i class="fa-solid fa-clock"></i></div><span class="app-card-name">Watches</span></div>
                </div>
            </section>

            <section class="category-section">
                <div class="category-header-row"><h2 class="category-title">2. Boys' Fashion</h2></div>
                <div class="app-store-grid">
                    <div class="app-card" onclick="selectCategoryFromModal('Boys\' Fashion > Clothing')"><div class="app-card-icon"><i class="fa-solid fa-child"></i></div><span class="app-card-name">Clothing</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Boys\' Fashion > Shoes')"><div class="app-card-icon"><i class="fa-solid fa-socks"></i></div><span class="app-card-name">Shoes</span></div>
                    <div class="app-card" onclick="selectCategoryFromModal('Boys\' Fashion > Accessories')"><div class="app-card-icon"><i class="fa-solid fa-hat-cowboy"></i></div><span class="app-card-name">Accessories</span></div>
                </div>
            </section>
        </div>
    </div>

    <!-- ফিক্সড বটম ন্যাভবার -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="openCategoryView()">
            <i class="fa-solid fa-border-all"></i>
            <span>Categories</span>
        </div>
        <div class="nav-item" onclick="alert('Seller Dashboard Active')">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
        </div>
    </nav>

    <script>
        function openCategoryView() {
            document.getElementById('categoryView').style.display = 'block';
        }
        function toggleCategoryView() {
            const view = document.getElementById('categoryView');
            view.style.display = view.style.display === 'block' ? 'none' : 'block';
        }
        function selectCategoryFromModal(categoryPath) {
            const selectBox = document.getElementById('prodCategorySelect');
            for(let i = 0; i < selectBox.options.length; i++) {
                if(selectBox.options[i].value === categoryPath) {
                    selectBox.selectedIndex = i;
                    break;
                }
            }
            toggleCategoryView();
            alert(`Selected Category: ${categoryPath}`);
        }
        function handleProductUpload(e) {
            e.preventDefault();
            const title = document.getElementById('prodTitle').value;
            const category = document.getElementById('prodCategorySelect').value;
            alert(`Product "${title}" successfully published under [${category}] and synced with Home page ecosystem!`);
            e.target.reset();
        }
    </script>
</body>
</html>
